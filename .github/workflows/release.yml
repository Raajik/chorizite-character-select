name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Windows so the shipped DLL matches what local deploy.sh produces.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content src/CharacterSelect/manifest.json -Raw | ConvertFrom-Json
          $version = $manifest.version
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tagged = '${{ github.ref_name }}' -replace '^v', ''
            if ($tagged -ne $version) {
              throw "Tag $tagged does not match manifest version $version. Bump manifest.json or retag."
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/CharacterSelect.Tests/CharacterSelect.Tests.csproj --configuration Release

      - name: Build
        run: dotnet build src/CharacterSelect/CharacterSelect.csproj --configuration Release

      - name: Stage plugin
        shell: pwsh
        run: |
          $output = 'src/CharacterSelect/bin/net8.0'
          $stage = 'stage/CharacterSelect'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          foreach ($name in 'CharacterSelect.dll','CharacterSelect.pdb','CharacterSelect.deps.json','CharacterSelect.runtimeconfig.json','CharacterSelect.xml','manifest.json') {
            $path = Join-Path $output $name
            if (Test-Path $path) { Copy-Item $path $stage }
          }
          Copy-Item (Join-Path $output 'assets') $stage -Recurse
          Get-ChildItem -Recurse $stage | Select-Object -ExpandProperty FullName

      - name: Package
        shell: pwsh
        run: |
          $zip = "CharacterSelect-${{ steps.version.outputs.tag }}.zip"
          Compress-Archive -Path stage/CharacterSelect -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Native tools signal "not found" through exit codes, so keep stderr non-fatal.
          $ErrorActionPreference = 'Continue'
          $tag = '${{ steps.version.outputs.tag }}'

          if (-not (git tag -l $tag)) {
            git tag $tag
            git push origin $tag
            if ($LASTEXITCODE -ne 0) { throw "Could not push tag $tag" }
          }

          gh release view $tag | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:ZIP --clobber
          } else {
            gh release create $tag $env:ZIP --title $tag --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Release step failed for $tag" }
